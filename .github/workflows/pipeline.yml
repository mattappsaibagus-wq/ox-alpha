name: pipeline
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
concurrency:
  group: pipeline
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      # Always use the latest main (re-runs of old runs would otherwise use stale code)
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Run pipeline and build dashboard
        env:
          COINGECKO_KEY: ${{ secrets.COINGECKO_KEY }}
        run: python build_static.py
      - name: Commit data
        run: |
          git config user.name "ox-alpha-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data.json || true
          git commit -m "pipeline run $(TZ=Asia/Tokyo date +'%F_%H:%M JST')" || exit 0
          # build_static.py can leave untracked/ignored files that block rebase
          git stash push --include-untracked --keep-index -m "ci-scratch" || true
          git restore --staged :/ || true
          git restore . || true
          git clean -fd || true
          # main may have moved during the ~20 min scan: rebase onto it, keep our fresh data.json
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Deploy the data just pushed by the scan job, not the run's original commit
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
