name: pipeline
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Run pipeline and build dashboard
        env:
          COINGECKO_KEY: ${{ secrets.COINGECKO_KEY }}
        run: python build_static.py
      - name: Commit data
        run: |
          git config user.name "ox-alpha-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data.json || true
          git commit -m "pipeline run $(date -u +%F_%H:%M)" || exit 0
          git push
  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
